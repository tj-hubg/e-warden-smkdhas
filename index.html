  <meta charset="UTF-8">

  <meta property="og:title" content="e-WARDEN SMKDHAS">

  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:ital,wght@1,400;1,500;1,600&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tailwind.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div id="loading-overlay" class="loading-overlay">
    <div class="text-center text-white">
      <div class="spinner mx-auto"></div>
      <p class="mt-4 font-bold">Memuatkan e-WARDEN...</p>
    </div>
  </div>

  <div class="app-shell">
    <img id="school-watermark" aria-hidden="true"
         class="pointer-events-none absolute left-1/2 top-1/2 z-0 h-[min(88vw,48rem)] w-[min(88vw,48rem)] -translate-x-1/2 -translate-y-1/2 rotate-[-18deg] object-contain opacity-[0.10] drop-shadow-[8px_10px_0_rgba(8,41,104,0.18)]">

    <header class="school-header sticky top-0 z-30 border-b-4 border-yellow-300">
      <div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-3">
        <div class="crest-frame flex h-24 w-24 shrink-0 items-center justify-center rounded-full p-1.5">
          <img id="school-logo" alt="Logo sekolah" class="h-full w-full object-contain hidden">
          <div id="logo-placeholder" class="flex h-20 w-20 items-center justify-center rounded-full border-2 border-dashed border-white/50 text-[10px] font-bold text-white/70">LOGO</div>
        </div>

        <div class="min-w-0 flex-1 text-white">
          <p id="school-name" class="font-bold tracking-wide">SMK DATUK HAJI AHMAD SAID</p>
          <h1 id="app-title" class="mt-0.5 font-extrabold tracking-tight">e-WARDEN</h1>
          <p id="app-subtitle" class="mt-0.5 text-xs">Sistem Kehadiran Warden</p>
        </div>

        <div id="header-actions" class="no-print flex items-center gap-2">
          <form id="admin-access-form" class="hidden items-center gap-2 rounded-xl bg-white/10 p-1">
            <input id="admin-code" type="password" inputmode="numeric" maxlength="8" placeholder="Kod akses"
                   class="w-24 rounded-lg border-0 px-2 py-2 text-xs text-blue-950 focus:outline-none focus:ring-2 focus:ring-yellow-300">
            <button type="submit" class="rounded-lg bg-white px-2 py-2 text-xs font-bold text-blue-950">OK</button>
          </form>
          <button id="mode-button" type="button"
                  class="action-button rounded-xl bg-yellow-300 px-3 py-2 text-xs font-extrabold text-blue-950 focus:outline-none focus:ring-2 focus:ring-white">
            PENTADBIR
          </button>
        </div>
      </div>
    </header>

    <main id="app-content" class="relative z-10 mx-auto max-w-6xl px-4 pb-44 pt-6">
      <div id="warden-slot"></div>
      <section id="admin-view" class="view">
        <div id="admin-slot"></div>
        <div id="report-slot"></div>
      </section>
    </main>

    <nav class="no-print fixed bottom-0 left-0 z-30 w-full border-t-2 border-yellow-300 bg-blue-950/95 px-2 pt-2 pb-1 backdrop-blur">
      <div id="warden-nav" class="mx-auto flex max-w-md justify-around">
        <button type="button" data-view="home" class="nav-item active rounded-xl px-4 py-2 text-xs font-bold text-white">
          <i data-lucide="house" class="mx-auto mb-1 h-5 w-5"></i>Utama
        </button>
        <button type="button" data-view="records" class="nav-item rounded-xl px-4 py-2 text-xs font-bold text-white">
          <i data-lucide="clipboard-list" class="mx-auto mb-1 h-5 w-5"></i>Rekod
        </button>
        <button type="button" data-view="profile" class="nav-item rounded-xl px-4 py-2 text-xs font-bold text-white">
          <i data-lucide="user" class="mx-auto mb-1 h-5 w-5"></i>Profil
        </button>
      </div>

      <div id="admin-nav" class="mx-auto hidden max-w-md justify-around">
        <button type="button" data-admin="dashboard" class="nav-item active rounded-xl px-4 py-2 text-xs font-bold text-white">
          <i data-lucide="layout-dashboard" class="mx-auto mb-1 h-5 w-5"></i>Dashboard
        </button>
        <button type="button" data-admin="attendance" class="nav-item rounded-xl px-4 py-2 text-xs font-bold text-white">
          <i data-lucide="bar-chart-3" class="mx-auto mb-1 h-5 w-5"></i>Kehadiran
        </button>
        <button type="button" data-admin="report" class="nav-item rounded-xl px-4 py-2 text-xs font-bold text-white">
          <i data-lucide="file-down" class="mx-auto mb-1 h-5 w-5"></i>Laporan
        </button>
      </div>

      <footer class="footer-copy">
        © 2026 | e-Warden SMKDHAS | Created &amp; Developed by Norhafizah Binti Abu Hassan
      </footer>
    </nav>

    <div id="toast" class="toast fixed bottom-24 left-1/2 z-50 w-[calc(100%-2rem)] max-w-md rounded-2xl bg-blue-950 px-5 py-4 text-center font-semibold text-white shadow-xl"></div>
  </div>

  <script defer src="js/vendor/lucide.min.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
